name: Pre-Unity package checks

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
  workflow_dispatch:

jobs:
  static-package-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate notebooks and scripts
        run: python scripts/validate_colab_package.py
      - name: Compile Python sources
        run: python -m compileall -q scripts
      - name: Validate export contract presence
        run: test -s docs/contracts/current-roster-pre-unity-export-contract.md
